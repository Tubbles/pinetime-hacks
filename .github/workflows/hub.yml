name: Hub T

# Builds Hub T (phone/hub-app, the phone-side integrations app that feeds
# the watch's next-event corner) into a debug APK via the Nix android dev
# shell, runs its JVM unit tests, and uploads the APK.

on:
  push:
    branches: [master]
    paths: ['phone/hub-app/**', 'flake.lock', 'flake.nix', '.github/workflows/hub.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      # Same stable signing and increasing versionCode as the other apps
      # (see phone-dialer.yml for why): the app's build.gradle.kts consumes
      # these two variables.
      - name: Configure stable debug signing and CI versionCode
        run: |
          echo "PINETIME_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/.github/debug.keystore" >> "$GITHUB_ENV"
          echo "PINETIME_CI_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Run unit tests and build the debug APK
        run: |
          nix develop .#android -c bash -c '
            set -e
            cd phone/hub-app
            gradle testDebugUnitTest assembleDebug --no-daemon --console=plain --stacktrace
          '

      - uses: actions/upload-artifact@v4
        with:
          name: hub-t-apk
          path: phone/hub-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
