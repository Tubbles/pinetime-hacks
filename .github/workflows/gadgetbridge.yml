name: Gadgetbridge T

# Builds Gadgetbridge T (the Gadgetbridge fork with PineTime call-state
# forwarding) into a debug APK via the Nix gadgetbridge dev shell and uploads
# it. Gradle 9.5.1 comes from the repo's own wrapper.

on:
  push:
    branches: [master]
    paths: ['phone/gadgetbridge-app', '.gitmodules', 'flake.lock', 'flake.nix', '.github/workflows/gadgetbridge.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build mainline debug APK
        run: |
          nix develop .#gadgetbridge -c bash -c '
            set -e
            cd phone/gadgetbridge-app
            chmod +x gradlew
            ./gradlew :app:assembleMainlineDebug --no-daemon --console=plain --stacktrace
          '

      - uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-t-apk
          path: phone/gadgetbridge-app/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
