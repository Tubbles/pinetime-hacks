name: Gadgetbridge T

# Builds Gadgetbridge T (the Gadgetbridge fork with PineTime call-state
# forwarding) into a debug APK and uploads it.
#
# Deliberately NOT built through the Nix shell: GB 0.92.2 compiles against
# the minor-versioned SDK platform 36.1 (compileSdk { minorApiLevel = 1 }),
# which AGP auto-installs into the SDK at build time — impossible in the
# read-only Nix store, fine in the runner's writable preinstalled SDK.
# Gradle 9.5.1 comes from the repo's own wrapper; JDK 21 from setup-java.

on:
  push:
    branches: [master]
    paths: ['phone/gadgetbridge-app', '.gitmodules', '.github/workflows/gadgetbridge.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A real clone, not a submodule checkout: GB's buildGitChangelog task
      # declares .git/HEAD as an input file, and in a submodule .git is a
      # gitlink file. Full history so the changelog/version tasks have tags.
      # GB's own codeberg externals are not needed for the mainline build.
      - name: Clone Gadgetbridge T at the pinned commit
        run: |
          gitlink=$(git rev-parse HEAD:phone/gadgetbridge-app)
          rm -rf phone/gadgetbridge-app
          git clone --branch callstate https://github.com/Tubbles/Gadgetbridge.git phone/gadgetbridge-app
          git -C phone/gadgetbridge-app checkout "$gitlink"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Without a stable key, every ephemeral runner generates a fresh debug
      # keystore and Android refuses to update an app whose signature changed
      # ("app not installed"). Seeding ~/.android/debug.keystore proved
      # unreliable (AGP resolved a different path and still generated fresh
      # keys), so the fork's build.gradle consumes these explicitly: the
      # committed keystore for signing, and the run number for a
      # monotonically increasing versionCode.
      - name: Configure stable debug signing and CI versionCode
        run: |
          echo "PINETIME_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/.github/debug.keystore" >> "$GITHUB_ENV"
          echo "PINETIME_CI_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build mainline debug APK
        run: |
          cd phone/gadgetbridge-app
          chmod +x gradlew
          ./gradlew :app:assembleMainlineDebug --no-daemon --console=plain --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: gadgetbridge-t-apk
          path: phone/gadgetbridge-app/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
