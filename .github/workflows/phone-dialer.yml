name: Phone dialer

# Builds the key-tones dialer (a Fossify Phone fork with the KeyToneReceiver)
# into a debug APK via the Nix android dev shell and uploads it, so the
# default-dialer app is installable without a local Android toolchain.

on:
  push:
    branches: [master]
    paths: ['phone/dialer-app', '.gitmodules', 'flake.lock', 'flake.nix', '.github/workflows/phone-dialer.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init the dialer submodule
        run: git submodule update --init phone/dialer-app

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      # Without a stable key, every ephemeral runner generates a fresh debug
      # keystore and Android refuses to update an app whose signature changed
      # ("app not installed"). Seeding ~/.android/debug.keystore proved
      # unreliable (AGP resolved a different path and still generated fresh
      # keys), so the fork's build.gradle consumes these explicitly: the
      # committed keystore for signing, and the run number for a
      # monotonically increasing versionCode.
      - name: Configure stable debug signing and CI versionCode
        run: |
          echo "PINETIME_DEBUG_KEYSTORE=$GITHUB_WORKSPACE/.github/debug.keystore" >> "$GITHUB_ENV"
          echo "PINETIME_CI_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      # Fossify ships three flavors (core/foss/gplay); foss is the F-Droid-style
      # one and the only one needed here.
      - name: Build foss debug APK
        run: |
          nix develop .#android -c bash -c '
            set -e
            cd phone/dialer-app
            gradle assembleFossDebug --no-daemon --console=plain --stacktrace
          '

      - uses: actions/upload-artifact@v4
        with:
          name: keytones-dialer-apk
          path: phone/dialer-app/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
