name: Phone app

# Builds the ClockSync clock (a BlackyHawky/Clock fork with the bridge) into a
# debug APK via the Nix android dev shell, and uploads it as an artifact, so a
# flashable/installable app is available without a local Android toolchain.

on:
  push:
    branches: [master]
    paths: ['phone/deskclock-app', '.gitmodules', 'flake.lock', '.github/workflows/phone-app.yml']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-android-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: 0
          purge-primary-key: never

      - name: Build debug APK
        # tag 2.20's output-naming uses a deprecated variant API that conflicts
        # with the configuration cache, so it is disabled here (see LOG.md).
        run: |
          nix develop .#android -c bash -c '
            set -e
            cd phone/deskclock-app
            gradle assembleDebug --no-daemon --no-configuration-cache --console=plain --stacktrace
          '

      - uses: actions/upload-artifact@v4
        with:
          name: clocksync-clock-apk
          path: phone/deskclock-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
